services:
  - type: web
    name: moagi-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd web && npm ci && npm run build
    startCommand: .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MOAGI_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: moagi-db
          property: connectionString
      - key: SEED_DEMO
        value: "false"
databases:
  - name: moagi-db
    plan: free